<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CommLocker Filing Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Michroma&display=swap">
<style>
:root{
  --bg:#F4F1EC;--card:#FFFFFF;--line:color-mix(in srgb,#2B4169 22%,transparent);--ink:#111C32;--ink2:#2A3650;--mute:#515D71;
  --hd:#071B42;--hd-ink:#EDEDED;--hd-dim:rgba(237,237,237,.7);--hd-field:rgba(237,237,237,.14);
  --orange:#C56230;--orange-hover:#E8793A;--orange-ink:#EDEDED;--orange-soft:color-mix(in srgb,#C56230 10%,#FFFFFF);--orange-line:color-mix(in srgb,#C56230 45%,transparent);
  --eyebrow:#B95722;
  --txt-c:#2B4169;--call-c:#0F766E;--vm-c:#16A34A;--miss-c:#B95722;--mail-c:#5B4B8A;
  --amber:#B95722;--amber-soft:color-mix(in srgb,#B95722 9%,#FFFFFF);--amber-line:color-mix(in srgb,#B95722 35%,transparent);
  --in-b:#F4F1EC;--out-b:color-mix(in srgb,#C56230 12%,#FFFFFF);--hover:#F4F1EC;--drop:color-mix(in srgb,#C56230 14%,#FFFFFF);--sel:color-mix(in srgb,#C56230 8%,#FFFFFF);
  --shadow:0 6px 24px rgba(7,27,66,.16);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#01173C;--card:#071B42;--line:#2B4169;--ink:#EDEDED;--ink2:color-mix(in srgb,#EDEDED 82%,#071B42);--mute:color-mix(in srgb,#EDEDED 58%,#071B42);
    --hd:#01173C;--hd-ink:#EDEDED;--hd-dim:rgba(237,237,237,.65);--hd-field:rgba(237,237,237,.12);
    --orange:#C56230;--orange-hover:#E8793A;--orange-ink:#EDEDED;--orange-soft:color-mix(in srgb,#C56230 22%,#071B42);--orange-line:color-mix(in srgb,#C56230 55%,transparent);
    --eyebrow:#E8793A;
    --txt-c:#9FB3D9;--call-c:#3FC1B2;--vm-c:#4ADE80;--miss-c:#E8793A;--mail-c:#B9A7E8;
    --amber:#E8793A;--amber-soft:color-mix(in srgb,#B95722 22%,#071B42);--amber-line:color-mix(in srgb,#E8793A 40%,transparent);
    --in-b:#0D2650;--out-b:color-mix(in srgb,#C56230 24%,#071B42);--hover:#0D2650;--drop:color-mix(in srgb,#C56230 24%,#071B42);--sel:color-mix(in srgb,#C56230 16%,#071B42);
    --shadow:0 6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
    --bg:#01173C;--card:#071B42;--line:#2B4169;--ink:#EDEDED;--ink2:color-mix(in srgb,#EDEDED 82%,#071B42);--mute:color-mix(in srgb,#EDEDED 58%,#071B42);
    --hd:#01173C;--hd-ink:#EDEDED;--hd-dim:rgba(237,237,237,.65);--hd-field:rgba(237,237,237,.12);
    --orange:#C56230;--orange-hover:#E8793A;--orange-ink:#EDEDED;--orange-soft:color-mix(in srgb,#C56230 22%,#071B42);--orange-line:color-mix(in srgb,#C56230 55%,transparent);
    --eyebrow:#E8793A;
    --txt-c:#9FB3D9;--call-c:#3FC1B2;--vm-c:#4ADE80;--miss-c:#E8793A;--mail-c:#B9A7E8;
    --amber:#E8793A;--amber-soft:color-mix(in srgb,#B95722 22%,#071B42);--amber-line:color-mix(in srgb,#E8793A 40%,transparent);
    --in-b:#0D2650;--out-b:color-mix(in srgb,#C56230 24%,#071B42);--hover:#0D2650;--drop:color-mix(in srgb,#C56230 24%,#071B42);--sel:color-mix(in srgb,#C56230 16%,#071B42);
    --shadow:0 6px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;margin:0;padding:0;overflow:hidden;max-width:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;display:block}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.ic{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-2px}

/* ---------- top bar ---------- */
.top{height:50px;background:var(--hd);color:var(--hd-ink);display:flex;align-items:center;gap:7px;padding:0 12px}
.brand{display:flex;align-items:center;white-space:nowrap;flex:1 1 auto;min-width:60px}
.wm{height:16px;width:auto;max-width:100%;display:block;object-fit:contain;object-position:left}
.preview .pvhead{background:#071B42;border-radius:6px;padding:8px 10px;margin-bottom:8px}
.preview .pvhead .wm{height:14px}
.tag{font-size:12px;color:var(--hd-dim);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--hd-field);border-radius:8px;padding:3px;gap:2px;flex:none}
.seg button{padding:5px 11px;border-radius:6px;font-size:12px;font-weight:700;color:var(--hd-dim)}
.seg button[aria-pressed="true"]{background:var(--orange);color:var(--orange-ink)}

/* ---------- shell ---------- */
#app{position:fixed;top:0;left:0;width:100%;height:100%;max-width:100%;min-width:0;margin:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;z-index:1}
@media (min-width:481px){#app{inset:0;margin:auto;width:360px;height:min(780px,100%);border:1px solid var(--line);border-radius:22px;box-shadow:0 0 60px rgba(0,0,0,.18)} body{background:color-mix(in srgb,var(--bg) 70%,#071B42 30%)}}
.top{flex:none}
.top .grow{flex:0 0 2px}
.tourbtn{background:var(--orange);}
.tourbtn:hover{background:var(--orange-hover)}
.tourbtn{color:#fff;border-radius:999px;padding:7px 12px;font-weight:800;font-size:12px;white-space:nowrap;flex:none}
.thm{width:32px;height:32px;border-radius:50%;background:var(--hd-field);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.thm .ic{width:16px;height:16px}
.thm:hover{background:rgba(255,255,255,.22)}
.shell{flex:1;min-height:0;display:flex;flex-direction:column;min-width:0}
.pane{background:var(--card);display:flex;flex-direction:column;min-height:0;min-width:0}
.left{flex:1 1 auto}
.tour{position:absolute;top:58px;left:12px;right:12px;z-index:90;transition:top .2s,bottom .2s;}
.tour.bottom{top:auto;bottom:12px}
.tour{background:var(--hd);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tour-h{display:flex;align-items:center;gap:8px;font-size:14px}
.tour-n{background:var(--orange);color:#fff;font-weight:800;font-size:11px;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tour-d{font-size:13px;line-height:1.45;color:rgba(255,255,255,.85);margin-top:6px}
.tour-a{display:flex;gap:6px;align-items:center;margin-top:10px}
.tour-a .grow{flex:1}
.tour .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.tour .btn.primary{background:var(--orange)}
.tour .btn:hover{color:#fff}
.ph{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ph-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ph h2{font-size:16px;font-weight:800;letter-spacing:-.2px}
.ph .count{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mute)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
.search input::placeholder{color:var(--mute)}
.srow{display:flex;gap:6px;align-items:stretch}
#chips:empty{display:none}
.ph-row[hidden]{display:none}
.dbtn .lbl{display:none}
.dbtn.on .lbl{display:inline}
.fhead{display:flex;flex-direction:column;gap:5px}
.fhead .back{align-self:flex-start;padding:2px 6px 2px 0;border:0;background:none;color:var(--orange);font-size:12px;margin:0}
.fttl{display:flex;align-items:center;gap:8px}
.fttl .fi{font-size:20px;flex:none}
.fttl b{font-size:17px;letter-spacing:-.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fst{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:2px 7px;flex:none}
.fmeta{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.frowx{display:flex;align-items:center;gap:8px}
.frowx .grow{flex:1}
.rowact{display:flex;gap:6px;margin-top:6px}
.chan{font-size:10px;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.rowact .btn{padding:4px 9px;font-size:11px}
.frow.closed{opacity:.6}
.fdiv{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:10px 0 2px}
.pop .pbtns{display:flex;gap:6px;padding:6px 8px 4px;justify-content:flex-end}
.srow .search{flex:1;min-width:0}
.dbtn{display:inline-flex;align-items:center;gap:5px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:12px;font-weight:700;white-space:nowrap}
.dbtn.on{border-color:var(--orange);background:var(--orange-soft);color:var(--amber)}
.dclr{width:30px;border-radius:10px;border:1px solid var(--orange-line);background:var(--orange-soft);color:var(--amber);font-size:16px;font-weight:800}
.selbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--orange-line);background:var(--card);font-size:13px;flex:none}
.selbar .grow{flex:1}
.narrow .row.selmode{grid-template-columns:22px 36px 1fr auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:5px;background:var(--card)}
.chip[aria-pressed="true"]{background:#071B42;color:#EDEDED;border-color:#071B42}
.chip .n{font-variant-numeric:tabular-nums;opacity:.7;font-weight:600}
.scroll{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain;position:relative}

/* folder banner in left pane */
.btn.back{align-self:flex-start;border-color:var(--orange);color:var(--orange);background:var(--orange-soft);font-size:13px;padding:8px 14px;margin-bottom:2px}
.fbanner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--sel);border:1px solid var(--orange-line)}
.fbanner .fi{font-size:20px;flex:none}
.fbanner b{font-size:14px}
.fbanner .m{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.fbanner .grow{flex:1;min-width:0}
.btn{padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--orange);color:var(--orange)}
.btn.primary{background:var(--orange);color:var(--orange-ink);border-color:var(--orange)}
.btn.primary:hover{background:var(--orange-hover);border-color:var(--orange-hover);color:var(--orange-ink)}
.btn.ghost{border-color:transparent}

.seg.dark{background:color-mix(in srgb,var(--line) 60%,transparent);align-self:flex-start}
.seg.dark button{color:var(--ink2)}
.tl{padding:6px 16px 14px}
.tl .who2{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--mute);margin:8px 0 2px}
.tl .who2 .av{width:20px;height:20px;font-size:9px}
.tl .out .who2{flex-direction:row-reverse}
.tlsum{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px 4px;font-size:12px;color:var(--mute)}
.tlsum .fchip{max-width:none}
/* ---------- conversation rows ---------- */
.row{display:grid;grid-template-columns:22px 40px 1fr auto;gap:12px;align-items:start;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.row:hover{background:var(--hover)}
.row.open{background:var(--hover)}
.row.dim{opacity:.55}
.row.dragging{opacity:.4}
.row .sel{margin-top:12px;width:16px;height:16px;accent-color:var(--orange);cursor:pointer}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:-.02em}
.l1{display:flex;align-items:baseline;gap:8px;min-width:0}
.l1 b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1 .role{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.l2{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px;margin-top:2px;min-width:0}
.l2 .prev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.l3{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.kind{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.kind .ic{width:12px;height:12px}
.k-text{color:var(--txt-c);background:color-mix(in srgb,var(--txt-c) 12%,transparent)}
.k-call{color:var(--call-c);background:color-mix(in srgb,var(--call-c) 12%,transparent)}
.k-vm{color:var(--vm-c);background:color-mix(in srgb,var(--vm-c) 12%,transparent)}
.k-miss{color:var(--miss-c);background:color-mix(in srgb,var(--miss-c) 12%,transparent)}
.k-mail{color:var(--mail-c);background:color-mix(in srgb,var(--mail-c) 12%,transparent)}
.card.mail{border-left-color:var(--mail-c)}
.card.mail .h{color:var(--mail-c)}
.card .sub{font-weight:700;font-size:13px;margin-top:2px}
.card .meta{font-size:11px;color:var(--mute);margin-top:1px;word-break:break-all}
.fx{margin-left:4px;width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;line-height:1;color:var(--mute);background:color-mix(in srgb,var(--mute) 14%,transparent);flex:none}
.fx:hover{background:var(--miss-c);color:#fff}
.ifolders span{display:inline-flex;align-items:center}
.frow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.frow .fi{font-size:20px;width:28px;text-align:center;flex:none}
.frow .fm{flex:1;min-width:0}
.frow .fm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .fm span{font-size:11px;color:var(--mute)}
.fact{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 0 10px 36px;border-bottom:1px solid var(--line)}
.fact input{flex:1;min-width:120px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:0;color:var(--ink)}
.fact .warn{width:100%;font-size:12px;color:var(--amber)}
.btn.danger{border-color:var(--miss-c);color:var(--miss-c)}
.btn.danger.primary{background:var(--miss-c);border-color:var(--miss-c);color:#fff}
.fnew{display:flex;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.fnew input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:0;color:var(--ink)}
.fnote{font-size:11px;color:var(--mute);margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fnote button{color:var(--eyebrow);font-weight:700;font-size:11px}
.sc.more{border-style:dashed;color:var(--eyebrow)}
.srow{display:flex;align-items:center;gap:10px;width:100%;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;color:var(--ink)}
.srow .si{width:30px;height:30px;border-radius:9px;background:var(--orange-soft);color:var(--eyebrow);display:inline-flex;align-items:center;justify-content:center;flex:none}
.srow .st{font-weight:700;font-size:14px;flex:1;min-width:0}
.srow .sv{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.srow .sc2{color:var(--mute)}
.prow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow.bad{background:var(--orange-soft);margin:0 -12px;padding:10px 12px;border-left:3px solid var(--orange)}
.prow .pm{flex:1;min-width:0}
.prow .pm b{display:block;font-size:14px}
.prow .pm>span{font-size:11.5px;color:var(--mute);display:block}
.pfix{margin-top:6px;font-size:12px;color:var(--ink2);line-height:1.4}
.pfix b{display:inline;font-size:inherit}
.pfix code{display:block;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--eyebrow);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;flex:none}
.pill.ok{color:var(--vm-c);background:color-mix(in srgb,var(--vm-c) 12%,transparent)}
.pwarn{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;background:var(--orange-soft);border:1px solid var(--orange-line);color:var(--eyebrow);font-size:12px;font-weight:700}
.pwarn span{flex:1;min-width:0}
.pwarn .btn{padding:5px 10px}
.narrow .strip .lbl a{color:var(--eyebrow);font-weight:700;cursor:pointer;text-transform:none;letter-spacing:0}
.cnt{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;display:inline-flex;gap:8px}
.fchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px 2px 5px;border-radius:999px;border:1px solid var(--orange-line);background:var(--orange-soft);color:var(--amber);white-space:nowrap}
.fchip.none{border-style:dashed;color:var(--mute);background:transparent;border-color:var(--line)}
.rside{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.when{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.file{padding:5px 10px;border-radius:8px;border:1.5px dashed var(--orange);color:var(--orange);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;background:var(--card)}
.file:hover{background:var(--orange-soft)}

/* thread */
.thread{background:var(--bg);border-bottom:1px solid var(--line);padding:6px 16px 14px 16px}
.divider{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);padding:12px 6px 6px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.item{display:flex;gap:8px;padding:4px 0;align-items:flex-end}
.item.out{flex-direction:row-reverse}
.item[draggable]{cursor:grab}
.item.dragging{opacity:.4}
.bubble{max-width:min(72%,560px);background:var(--in-b);border-radius:14px;padding:8px 12px 6px;position:relative}
.out .bubble{background:var(--out-b)}
.bubble .who{font-size:11px;font-weight:700;color:var(--mute);margin-bottom:1px}
.bubble .t{white-space:pre-wrap;word-wrap:break-word}
.bubble .ts{font-size:10px;color:var(--mute);text-align:right;margin-top:3px;font-variant-numeric:tabular-nums}
.note{margin-top:6px;padding:6px 9px;background:var(--amber-soft);border-left:3px solid var(--amber);border-radius:0 6px 6px 0;font-size:12px;color:var(--amber)}
.note b{font-size:10px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:1px}
.att{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:6px;background:var(--card);border:1px solid var(--line);margin:6px 4px 0 0;color:var(--ink2)}
.card{max-width:min(72%,560px);background:var(--card);border:1px solid var(--line);border-left:3px solid var(--call-c);border-radius:10px;padding:9px 12px}
.card.vm{border-left-color:var(--vm-c)}
.card.miss{border-left-color:var(--miss-c)}
.card .h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--call-c)}
.card.vm .h{color:var(--vm-c)}
.card.miss .h{color:var(--miss-c)}
.card .h .ts{margin-left:auto;font-weight:500;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.card .q{font-style:italic;color:var(--ink2);margin-top:4px;font-size:13px}
.card .n{margin-top:5px;font-size:12px;color:var(--ink2)}
.ifile{opacity:.35;transition:opacity .12s;align-self:center;padding:4px;border-radius:6px;color:var(--mute)}
.item:hover .ifile{opacity:1}
.ifile:hover{color:var(--orange);background:var(--orange-soft)}
.hash{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:10px;color:var(--mute);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hash .ic{width:10px;height:10px;color:var(--vm-c)}
.hash b{color:var(--vm-c);font-weight:700}
.k-lock{color:var(--mute);background:color-mix(in srgb,var(--mute) 12%,transparent)}
.ifolders{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.ifolders span{font-size:10px;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.more{margin:8px 6px 0;font-size:12px;color:var(--mute)}
.thead{display:flex;align-items:center;gap:8px;padding:10px 4px 4px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.thead .grow{flex:1}
.thead .btn{padding:5px 10px;font-size:12px}
.thead .btn.on{background:var(--hd);color:#fff;border-color:var(--hd)}
.pk{width:18px;height:18px;accent-color:var(--orange);align-self:center;flex:none;cursor:pointer}
.item.pickable{cursor:pointer;border-radius:12px;padding:6px 4px}
.item.pickable:hover{background:color-mix(in srgb,var(--orange) 8%,transparent)}
.item.picked{background:var(--sel);outline:1.5px solid var(--orange-line)}
.pickbar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:10px -16px -14px;padding:10px 16px;background:var(--card);border-top:1px solid var(--orange-line);font-size:13px;font-weight:600;box-shadow:0 -6px 16px rgba(16,28,56,.06)}
.pickbar .grow{flex:1}
.narrow .pickbar{margin:10px -10px -12px;padding:10px}
.more button{color:var(--orange);font-weight:700}
.item.rest{opacity:.42}


/* ---------- folders pane ---------- */
.newf{display:flex;gap:8px;align-items:center;border:1.5px dashed var(--orange-line);border-radius:10px;padding:8px 10px;background:var(--card)}
.newf.hot{background:var(--drop);border-color:var(--orange);border-style:solid}
.newf input{flex:1;background:none;border:0;outline:0;min-width:0}
.newf input::placeholder{color:var(--mute)}
.fl{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.folder{display:grid;grid-template-columns:38px 1fr;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card);transition:border-color .12s,background .12s}
.folder:hover{border-color:var(--orange-line)}
.folder.on{border-color:var(--orange);background:var(--sel)}
.folder.hot{border-color:var(--orange);background:var(--drop);border-style:dashed}
.folder .fi{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.folder .fn{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder .fm{font-size:11px;color:var(--mute);margin-top:2px;font-variant-numeric:tabular-nums}
.folder .fs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.folder .fs .kind{font-size:10px;padding:1px 6px}
.folder .fa{display:flex;gap:6px;margin-top:8px}
.folder .fa .btn{padding:5px 9px;font-size:11px}
.hint{padding:10px 16px 14px;font-size:12px;color:var(--mute);line-height:1.5;border-top:1px solid var(--line)}

/* strip (phone) */
.strip{display:none}

/* ---------- popover / toast ---------- */
.pop{position:absolute;z-index:80;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:280px;max-width:calc(100vw - 24px);padding:6px;display:none}
.pop.open{display:block}
.pop .pt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--eyebrow);padding:8px 10px 4px}
.pop .po{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
.pop .po:hover{background:var(--hover)}
.pop .po .fi{font-size:18px;width:24px;text-align:center}
.pop .po .fn{flex:1;font-weight:600;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop .po .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff}
.pop .po.in .ck{background:var(--vm-c);border-color:var(--vm-c)}
.pop .ps{font-size:11px;color:var(--mute);padding:0 10px 6px}
.pop .done{display:flex;justify-content:flex-end;gap:4px;padding:6px 8px 2px}
.pop .newrow{display:flex;gap:6px;padding:6px 8px 4px;border-top:1px solid var(--line);margin-top:4px}
.pop .newrow input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:0;min-width:0}
.pop .newrow input:focus{border-color:var(--orange)}
.pop .drow{display:flex;gap:6px;padding:6px 8px 4px;border-top:1px solid var(--line);margin-top:4px}
.pop .drow label{flex:1;display:flex;flex-direction:column;gap:3px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--eyebrow);min-width:0}
.pop .drow input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;outline:0;min-width:0;font:inherit;font-size:12px;color:var(--ink);width:100%}
.pop .drow input:focus{border-color:var(--orange)}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%) translateY(8px);background:var(--hd);color:#fff;padding:9px 14px;border-radius:999px;font-weight:600;font-size:12px;opacity:0;transition:.2s;pointer-events:none;z-index:95;box-shadow:var(--shadow);white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{padding:40px 20px;text-align:center;color:var(--mute);font-size:13px}


/* ---------- three-dot menu + export sheet ---------- */
.more-btn{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-weight:800;font-size:18px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.more-btn:hover{border-color:var(--orange);color:var(--orange)}
.pop .po small{display:block;font-size:11px;color:var(--mute);font-weight:500;margin-top:1px}
.ov{position:absolute;inset:0;z-index:70;display:none;background:var(--card);color:var(--ink)}
.ov.open{display:flex;flex-direction:column}
.sheet{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px 12px 12px;overflow-y:auto}
.xh{display:flex;align-items:center;gap:8px;height:44px;flex:none;margin:0 -12px;padding:0 8px;border-bottom:1px solid var(--line)}
.xh .btn{padding:6px 8px}
.xh .xt{min-width:0;line-height:1.15}
.xh .xt b{display:block;font-size:14px}
.xh .xt span{display:block;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);font-weight:700;font-size:12px;flex-wrap:wrap}
.chk.ok{border-color:color-mix(in srgb,var(--vm-c) 40%,transparent);background:color-mix(in srgb,var(--vm-c) 8%,transparent);color:var(--vm-c)}
.chk.warn{border-color:var(--orange-line);background:var(--orange-soft);color:var(--amber)}
.chk .d{margin-left:auto;font-weight:500;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.chk .fix{width:100%;display:flex;gap:6px;margin-top:4px}
.chk .fix input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;outline:0;min-width:0;font-weight:500;color:var(--ink);font-size:12px}
.xscope{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);padding:5px 8px;width:100%;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--card);flex-wrap:wrap}
.xscope.on{border-color:var(--orange-line);background:var(--orange-soft)}
.xscope .ic{width:14px;height:14px;color:var(--orange)}
.xlist{flex:1;min-height:90px;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.xcard{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12px}
.xcard .xc1{flex:1;min-width:0;line-height:1.25}
.xcard .xc1 b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xcard .xc1 span{color:var(--mute);font-size:11px}
.xcard .xc2{font-family:ui-monospace,Menlo,monospace;font-size:9px;color:var(--mute);line-height:1.3;text-align:right;white-space:nowrap}
.pvtabs{display:flex;gap:6px;flex:none;padding:8px 0 0;overflow-x:auto}
.pvtabs .chip{flex:none}
.xscope b{color:var(--ink)}
.xscope .xid{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--mute);white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tiles div{border:1px solid var(--line);border-radius:9px;padding:5px 6px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;line-height:1.15}
.tiles div small{font-size:8px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.hashbox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;line-height:1.45}
.hashbox b{display:block;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--eyebrow);margin-bottom:2px}
.hashbox .ok{color:var(--vm-c);font-weight:700}
.hashbox .why{display:block;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:11px;color:var(--ink2);margin-top:2px;word-break:normal}
.segx{display:flex;gap:6px}
.segx button{flex:1;padding:9px 8px;border-radius:10px;border:1.5px solid var(--line);font-size:12px;font-weight:700;color:var(--ink2);background:var(--card)}
.segx button.on{border-color:var(--orange);background:var(--sel);color:var(--amber)}
.segx button:disabled{opacity:.45}
.xfiles{font-size:11px;color:var(--mute);padding:0 2px}
.xgrow{flex:1}
.xbig{width:100%;justify-content:center;padding:12px;font-size:14px;border-radius:12px}
.xsmall{width:100%;justify-content:center}
.pvscroll{flex:1;min-height:0;overflow-y:auto;padding-top:10px}
.preview{border:1px solid #2B4169;border-radius:8px;padding:14px;background:#fff;color:#111C32;font-size:11px;line-height:1.5;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.preview h5{font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px;color:#071B42}
.preview .brand{margin-bottom:2px}
.preview .row2{display:grid;grid-template-columns:auto 1fr;gap:1px 10px}
.preview .row2 span:nth-child(odd){color:#555}
.preview .mono{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;word-break:break-all;color:#333}
.preview .m{color:#16A34A;font-weight:700}
.preview hr{border:0;border-top:1px solid #ddd;margin:10px 0}
.preview p{margin:0 0 4px}

/* ---------- narrow / phone layout ---------- */
.narrow .strip{display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px;flex:none;padding:6px 8px 8px;background:var(--card);border-top:1px solid var(--line)}
.narrow .strip .lbl{width:100%;display:flex;justify-content:space-between;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:0 2px}
.narrow .strip .lbl span{font-weight:600;letter-spacing:0;text-transform:none}
.sc{display:inline-flex;align-items:center;gap:4px;padding:6px 8px;border-radius:9px;border:1.5px solid var(--line);font-size:11px;font-weight:700;background:var(--card);max-width:100%;text-align:left;flex:none}
.sc .t{white-space:nowrap}
.sc .n{flex:none;color:var(--mute);font-weight:600}
.sc[hidden]{display:none}
.sc.on{border-color:var(--orange);background:var(--sel)}
.sc.hot{border-color:var(--orange);background:var(--drop)}
.sc.add{border-style:dashed;color:var(--orange);border-color:var(--orange-line)}
.sc .n{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:600}
.narrow .row{grid-template-columns:36px 1fr auto;gap:10px;padding:11px 12px}
.narrow .l1 .role{display:none}
.narrow .bubble,.narrow .card{max-width:84%}
.narrow .ifile{opacity:1}
.narrow .thread{padding:4px 10px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const partiesOf = list => { const s=new Set(); list.forEach(({i,c})=>{ if(c.group) c.members.forEach(m=>{ const x=contactById(m); if(x) s.add(x); }); else s.add(c); }); return [...s].sort((a,b)=>a.name.localeCompare(b.name)); };
const itemsFor = c => { const base = state.folder ? c.items.filter(i=>i.folders.includes(state.folder)) : c.items; return rangeOn(state.range) ? base.filter(i=>inRange(i,state.range)) : base; };
const kindIcon = i => i.type==='text'?'i-text':i.type==='vm'?'i-vm':i.type==='email'?'i-mail':i.missed?'i-miss':'i-call';
const kindClass = i => i.type==='text'?'k-text':i.type==='vm'?'k-vm':i.type==='email'?'k-mail':i.missed?'k-miss':'k-call';
const kindLabel = i => i.type==='text'?'Text':i.type==='vm'?(i.dir==='out'?'Voicemail left':'Voicemail'):i.type==='email'?(i.dir==='out'?'Email sent':'Email'):i.missed?'No answer':(i.dir==='in'?'Inbound call':'Outbound call');
function summary(i){
  if(i.type==='text') return i.text;
  if(i.type==='email') return i.subject;
  if(i.type==='vm') return kindLabel(i)+' · '+i.dur+' · “'+i.transcript.slice(0,90)+'…”';
  return kindLabel(i)+(i.dur&&i.dur!=='0:00'?' · '+i.dur:'')+(i.note?' · '+i.note:'');
}
function counts(items){
  const c={text:0,call:0,vm:0,email:0}; items.forEach(i=>c[i.type]++); return c;
}
function folderStats(fid){
  let texts=0,calls=0,vms=0,emails=0,contacts=0;
  state.contacts.forEach(c=>{const it=c.items.filter(i=>i.folders.includes(fid)); if(it.length){contacts++; const k=counts(it); texts+=k.text;calls+=k.call;vms+=k.vm;emails+=k.email;}});
  return {contacts,texts,calls,vms,emails,items:texts+calls+vms+emails};
}

/* ---------- hashes ---------- */
function fullHash(seed){ let out=''; let h=0x811c9dc5; for(let r=0;r<8;r++){ for(let k=0;k<seed.length;k++){ h^=seed.charCodeAt(k); h=Math.imul(h,16777619)>>>0; } h^=Math.imul(r+1,0x9e3779b9)>>>0; h=Math.imul(h^(h>>>15),2246822519)>>>0; h=(h^(h>>>13))>>>0; out+=h.toString(16).padStart(8,'0'); } return out; }
const itemSeed = i => (i.subject?i.subject+'|':'')+(i.text||i.transcript||i.note||'')+'|'+i.ts+'|'+i.type;
function hashOf(i){ return 'sha256:'+fullHash(itemSeed(i)).slice(0,16)+'…'; }

const EXPORTER={name:'Lauren Cotner',lic:'DRE #01242185',org:'Épique Realty',line:'(310) 508-5957'};
let ex=null;
function scopeItems(sc){ const out=[]; if(sc.kind==='conv'){ const c=contactById(sc.id); c.items.forEach(i=>out.push({i,c})); } else { state.contacts.forEach(c=>c.items.forEach(i=>{ if(i.folders.includes(sc.id)) out.push({i,c}); })); } out.sort((a,b)=>a.i.t-b.i.t); return out; }
function attachmentsOf(list){ const files=[]; list.forEach(({i,c})=>{ (i.att||[]).forEach(a=>files.push({name:a.name,kind:a.type,from:c.name,seed:a.name+i.ts})); if(i.type==='vm'){ const d=new Date(i.t); const stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0'); files.push({name:'voicemail-'+stamp+'.m4a',kind:'audio',from:c.name,seed:'a'+i.ts}); files.push({name:'voicemail-'+stamp+'-transcript.txt',kind:'text',from:c.name,seed:'t'+i.ts}); } }); return files; }
function buildOne(sc,list,title,now){
  const ymd=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0'); const al='ABCDEFGHJKLMNPQRSTUVWXYZ0123456789'; const hx=fullHash(title+list.length+ymd); let code=''; for(let k=0;k<8;k++) code+=al[parseInt(hx.slice(k*2,k*2+2),16)%al.length]; const id='CL-'+ymd+'-'+code;
  const exportHash=fullHash(list.map(x=>fullHash(itemSeed(x.i))).join('')+id);
  return {sc,list,title,id,exportHash,files:attachmentsOf(list)};
}
/* one export = one scope + one date range. A batch is that same build run once per person; nothing is merged. */
function rebuildExport(){
  const {sc,now,range}=ex; const filt=l=>rangeOn(range)?l.filter(x=>inRange(x.i,range)):l;
  if(sc.kind==='batch'){
    ex.batch=sc.ids.map(id=>{ const all=scopeItems({kind:'conv',id}); const o=buildOne({kind:'conv',id},filt(all),contactById(id).name,now); o.total=all.length; return o; });
    ex.all=ex.batch.flatMap(b=>scopeItems(b.sc)); ex.list=ex.batch.flatMap(b=>b.list); ex.files=ex.batch.flatMap(b=>b.files);
    ex.title=sc.ids.length+' people · separate exports'; ex.id=''; ex.exportHash=''; if(ex.pv>=ex.batch.length) ex.pv=0;
  } else {
    ex.all=scopeItems(sc); const title=sc.kind==='conv'?contactById(sc.id).name:folderById(sc.id).name;
    Object.assign(ex,buildOne(sc,filt(ex.all),title,now)); ex.batch=null;
  }
}

}

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- filing ---------- */
function addTo(item,fid){ if(!item.folders.includes(fid)) item.folders.push(fid); }
function removeFrom(item,fid){ item.folders=item.folders.filter(f=>f!==fid); }
function payloadItems(p){
  if(p.kind==='conv') return contactById(p.id).items;
  if(p.kind==='item') return [contactById(p.cid).items.find(i=>i.id===p.id)];
  if(p.kind==='multi') return [...state.selected].flatMap(id=>contactById(id).items);
  if(p.kind==='items') return contactById(p.cid).items.filter(i=>state.picked.has(i.id));
  return [];
}
function payloadName(p){
  if(p.kind==='conv') return contactById(p.id).name;
  if(p.kind==='item'){ const i=payloadItems(p)[0]; return (i.type==='text'?'message':i.type==='vm'?'voicemail':'call')+' from '+contactById(p.cid).name; }
  if(p.kind==='items'){ const n=payloadItems(p).length; return n+' item'+(n!==1?'s':'')+' from '+contactById(p.cid).name; }
  return state.selected.size+' conversations';
}
function fileTo(p,fid){
  const f=folderById(fid); payloadItems(p).forEach(i=>addTo(i,fid));
  saveState(); toast('Added '+payloadName(p)+' to '+f.icon+' '+f.name); render();
}
function unfileFrom(p,fid){
  const f=folderById(fid); payloadItems(p).forEach(i=>removeFrom(i,fid));
  saveState(); toast('Removed '+payloadName(p)+' from '+f.name); render();
}
function inFolder(p,fid){ const it=payloadItems(p); return it.length>0 && it.every(i=>i.folders.includes(fid)); }
function createFolder(name){
  const id=Math.max(0,...state.folders.map(f=>f.id))+1;
  const f={id,name,cat:'New',icon:'📁',note:'',status:'active',createdAt:Date.now()}; state.folders.push(f); saveState(); return f;
}

/* ---------- popover ---------- */
function openPop(ev,p){
  ev.stopPropagation();
  state.pop=p; const pop=document.getElementById('pop');
  pop.innerHTML=`<div class="pt">Add ${esc(payloadName(p))} to</div><div class="ps">Tap as many folders as you like. Tap again to remove.</div>`+
    activeFolders().map(f=>`<button class="po ${inFolder(p,f.id)?'in':''}" onclick="togglePop(${f.id})"><span class="fi">${f.icon}</span><span class="fn">${esc(f.name)}</span><span class="ck"><svg class="ic" style="width:11px;height:11px"><use href="#i-check"/></svg></span></button>`).join('')+(closedFolders().length?`<div class="ps">${closedFolders().length} closed folder${closedFolders().length>1?'s':''} not listed · reopen from manage</div>`:'')+
    `<div class="newrow"><input id="popnew" type="text" placeholder="New folder name" onkeydown="if(event.key==='Enter')popNew()"><button class="btn primary" onclick="popNew()">Create & add</button></div>
    <div class="done"><button class="btn" onclick="closePop()">Done</button></div>`;
  pop.classList.add('open'); placePop(ev,pop);
}
function togglePop(fid){ const p=state.pop; if(inFolder(p,fid)) unfileFrom(p,fid); else fileTo(p,fid); openPopRefresh(); }
function openPopRefresh(){ const p=state.pop; const pop=document.getElementById('pop'); const af=activeFolders(); pop.querySelectorAll('.po').forEach((b,i)=>b.classList.toggle('in',inFolder(p,af[i].id))); }
function popNew(){ const el=document.getElementById('popnew'); const n=el.value.trim(); if(!n){el.focus({preventScroll:true});return;} const f=createFolder(n); fileTo(state.pop,f.id); closePop(); }
function closePop(){ const p=state.pop; document.getElementById('pop').classList.remove('open'); state.pop=null; if(p&&p.kind==='multi'){ state.selected.clear(); render(); } }
document.addEventListener('click',e=>{ if(!e.target.closest('#pop')) closePop(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closePop(); if(ex) closeExport(); if(document.getElementById('fov').classList.contains('open')) closeFolderSheet(); closeSettings(); if(document.getElementById('pov').classList.contains('open')) closePerms(); } });

/* ---------- drag & drop ---------- */
let drag=null;
function dragStart(ev,p){ drag=p; ev.dataTransfer.effectAllowed='link'; ev.dataTransfer.setData('text/plain',payloadName(p)); ev.currentTarget.classList.add('dragging'); }
function dragEnd(ev){ ev.currentTarget.classList.remove('dragging'); drag=null; document.querySelectorAll('.hot').forEach(e=>e.classList.remove('hot')); }
function dropTargets(){
  document.querySelectorAll('[data-drop]').forEach(el=>{
    el.addEventListener('dragover',e=>{ if(!drag) return; e.preventDefault(); e.dataTransfer.dropEffect='link'; el.classList.add('hot'); });
    el.addEventListener('dragleave',()=>el.classList.remove('hot'));
    el.addEventListener('drop',e=>{
      e.preventDefault(); el.classList.remove('hot'); if(!drag) return;
      const fid=el.dataset.drop;
      fileTo(drag,+fid);
      drag=null;
    });
  });
}

/* ---------- render ---------- */
function visibleContacts(){
  const q=state.q.trim().toLowerCase();
  return state.contacts.filter(c=>{
    const items=itemsFor(c); if((state.folder||rangeOn(state.range)) && !items.length) return false;
    if(state.filter==='text'&&!items.some(i=>i.type==='text')) return false;
    if(state.filter==='call'&&!items.some(i=>i.type==='call')) return false;
    if(state.filter==='vm'&&!items.some(i=>i.type==='vm')) return false;
    if(state.filter==='email'&&!items.some(i=>i.type==='email')) return false;
    if(state.filter==='unfiled'&&(c.spam||state.hidden.has(c.id)||convFolders(c).length)) return false;
    if(state.filter==='hidden'){ if(!state.hidden.has(c.id)) return false; } else if(!state.folder&&state.hidden.has(c.id)) return false;
    if(q){ const m=searchMatch(c,q); if(!m) return false; }
    return true;
  }).sort((a,b)=>q?(searchMatch(a,q).rank-searchMatch(b,q).rank):0);
}
/* who matches: the name, number or role (rank 0, listed first), or a whole word inside a message (rank 1) */
function searchMatch(c,q){
  if((c.name+' '+c.number+' '+(c.role||'')).toLowerCase().includes(q)) return {rank:0};
  const re=new RegExp('(^|[^a-z0-9])'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=$|[^a-z0-9])','i');
  const hits=itemsFor(c).filter(i=>re.test((i.subject||'')+' '+(i.text||i.transcript||i.note||''))).length;
  return hits?{rank:1,hits}:null;
}
function render(){
  document.getElementById('app').classList.add('narrow');
  renderBanner(); renderChips(); renderRows(); renderStrip(); renderSelbar(); dropTargets();
}
function renderSelbar(){
  const sb=document.getElementById('selbar'); sb.hidden=!state.selMode; if(!state.selMode) return;
  const n=state.selected.size;
  sb.innerHTML=`<span><b>${n} ${n===1?'person':'people'}</b> selected</span><span class="grow"></span><button class="btn ghost" onclick="endSelect()">Cancel</button><button class="btn primary" ${n?'':'disabled style="opacity:.5"'} onclick="openExport({kind:'batch',ids:[...state.selected]})"><svg class="ic"><use href="#i-pdf"/></svg> Export ${n} separately</button>`;
}
function renderBanner(){
  const el=document.getElementById('fbanner');
  if(!state.folder){ el.innerHTML=permBanner(); document.getElementById('lt').textContent='Everything on this phone'; return; }
  const f=folderById(state.folder), s=folderStats(f.id); const closed=f.status==='closed';
  const ts=[]; state.contacts.forEach(c=>c.items.forEach(i=>{ if(i.folders.includes(f.id)) ts.push(i.t); })); ts.sort((a,b)=>a-b);
  const span=ts.length?(fmtDay(ts[0])+' – '+fmtDay(ts[ts.length-1])+(yr(ts[ts.length-1])!==yr(LATEST)?', '+yr(ts[ts.length-1]):'')):'';
  const parts=[s.contacts+' '+(s.contacts===1?'person':'people'),s.texts?s.texts+' text'+(s.texts!==1?'s':''):'',s.calls?s.calls+' call'+(s.calls!==1?'s':''):'',s.vms?s.vms+' voicemail'+(s.vms!==1?'s':''):'',s.emails?s.emails+' email'+(s.emails!==1?'s':''):'',span].filter(Boolean);
  el.innerHTML=`<div class="fhead">
    <button class="btn back" onclick="openFolder(null)"><svg class="ic"><use href="#i-back"/></svg> All conversations</button>
    <div class="fttl"><span class="fi">${f.icon}</span><b>${esc(f.name)}</b>${closed?`<span class="fst">Closed</span>`:''}<button class="more-btn" title="Rename, close or delete this folder" aria-label="Folder options" onclick="openFolderSheet(${f.id})">⋯</button></div>
    <div class="fmeta">${parts.join(' · ')}${closed?' · closed '+fmtDay(f.closedAt)+', '+yr(f.closedAt):''}</div>
    <div class="frowx"><div class="seg dark" role="group" aria-label="Folder view"><button aria-pressed="${state.view==='timeline'}" onclick="state.view='timeline';render()">Timeline</button><button aria-pressed="${state.view==='person'}" onclick="state.view='person';render()">By person</button></div><span class="grow"></span>${closed?`<button class="btn" onclick="reopenFolder(${f.id})">Reopen</button>`:''}<button class="btn primary" onclick="openExport({kind:'folder',id:${f.id}})"><svg class="ic"><use href="#i-pdf"/></svg> Export…</button></div>
  </div>`;
}
function renderChips(){
  const all=state.contacts.filter(c=>!state.folder||itemsFor(c).length);
  const items=all.flatMap(c=>itemsFor(c)); const k=counts(items);
  const pl=(n,a,b)=>n+' '+(n===1?a:b);
  const FL={all:'',text:'Texts',call:'Calls',vm:'Voicemails',email:'Emails',unfiled:'Not in a folder',hidden:'Hidden people'};
  const fb=document.getElementById('fbtn'); const fon=state.filter!=='all'; fb.classList.toggle('on',fon); document.getElementById('fbtn-t').textContent=FL[state.filter]||'';
  const ch=[];
  if(!state.folder){ const np=all.filter(c=>!c.spam&&!state.hidden.has(c.id)&&!convFolders(c).length).length;
    ch.push(`<button class="chip" aria-pressed="${state.filter==='unfiled'}" onclick="state.filter=state.filter==='unfiled'?'all':'unfiled';render()">${pl(np,'person','people')} not in a folder yet</button>`);
    if(state.hidden.size) ch.push(`<button class="chip" aria-pressed="${state.filter==='hidden'}" onclick="state.filter=state.filter==='hidden'?'all':'hidden';render()">${pl(state.hidden.size,'person','people')} hidden</button>`); }
  document.getElementById('chips').innerHTML=ch.join('');
  document.getElementById('phrow').hidden=!!state.folder;
  const q=state.q.trim(); document.getElementById('lc').textContent=q?pl(visibleContacts().length,'person','people')+' match “'+q+'”':pl(all.length,'person','people')+' · '+pl(items.length,'item','items');
  const on=rangeOn(state.range); const db=document.getElementById('dbtn'); db.classList.toggle('on',on); document.getElementById('dbtn-t').textContent=on?fmtRange(state.range,true):''; document.getElementById('dclr').hidden=!on;
}
function renderRows(){
  const el=document.getElementById('rows');
  if(state.folder&&state.view==='timeline'){ el.innerHTML=renderTimeline(); return; }
  const list=visibleContacts();
  if(!list.length){ el.innerHTML='<div class="empty">Nothing here yet. Tap ⋯ on any conversation, then Add to folder.</div>'; return; }
  el.innerHTML=list.map(c=>{
    const items=itemsFor(c); const last=items[items.length-1]; const k=counts(items); const fs=convFolders(c);
    const open=state.open.has(c.id);
    const cnt=[k.text?k.text+' text'+(k.text>1?'s':''):'',k.call?k.call+' call'+(k.call>1?'s':''):'',k.vm?k.vm+' voicemail'+(k.vm>1?'s':''):'',k.email?k.email+' email'+(k.email>1?'s':''):''].filter(Boolean).map(s=>`<span>${s}</span>`).join('');
    const chips=fs.length?fs.map(f=>`<span class="fchip" title="${esc(f.name)}">${f.icon} ${esc(cut25(f.name))}<button class="fx" title="Take ${esc(c.name)} out of ${esc(f.name)}" aria-label="Remove from ${esc(f.name)}" onclick="event.stopPropagation();unfileConv('${c.id}',${f.id})">×</button></span>`).join(''):(c.spam?'':`<span class="fchip none">no folder yet</span>`);
    const lock=c.spam?'':`<span class="kind k-lock" title="Every item was hashed when it was pulled from the phone"><svg class="ic"><use href="#i-lock"/></svg>${items.length} hashed</span>`;
    const act=(!state.folder&&state.filter==='unfiled')?`<div class="rowact"><button class="btn primary" onclick="event.stopPropagation();startFiling('${c.id}')"><svg class="ic"><use href="#i-folder"/></svg> Add to folder</button><button class="btn" onclick="event.stopPropagation();hideConv('${c.id}')">Hide</button></div>`
      :(!state.folder&&state.filter==='hidden')?`<div class="rowact"><button class="btn" onclick="event.stopPropagation();unhideConv('${c.id}')">Unhide</button></div>`:'';
    const q=state.q.trim().toLowerCase(); const sm0=q?searchMatch(c,q):null; const why=sm0&&sm0.rank===1?`<span class="fchip none">mentions “${esc(state.q.trim())}” in ${sm0.hits} item${sm0.hits!==1?'s':''}</span>`:'';
    const sm=state.selMode, sel=state.selected.has(c.id);
    return `<div class="row ${open?'open':''} ${c.spam?'dim':''} ${sm?'selmode':''}" data-cid="${c.id}" draggable="${!sm}" ondragstart="dragStart(event,{kind:'conv',id:'${c.id}'})" ondragend="dragEnd(event)" onclick="${sm?`toggleSel('${c.id}')`:`toggleOpen('${c.id}')`}">
      ${sm?`<input type="checkbox" class="sel" ${sel?'checked':''} aria-label="Select ${esc(c.name)} for export" onclick="event.stopPropagation();toggleSel('${c.id}')">`:''}<div class="av" style="background:${c.color}">${esc(c.avatar)}</div>
      <div style="min-width:0">
        <div class="l1"><b>${esc(c.name)}</b><span class="role">${esc(c.group?'group text · '+c.members.map(m=>(contactById(m)||{}).name).filter(Boolean).join(', ')+', you':[c.role,c.number].filter(Boolean).join(' · '))}</span></div>
        <div class="l2"><span class="kind ${kindClass(last)}"><svg class="ic"><use href="#${kindIcon(last)}"/></svg>${kindLabel(last)}</span><span class="prev">${esc(summary(last))}</span></div>
        <div class="l3"><span class="cnt">${cnt}</span>${lock}${why}${chips}</div>${act}
      </div>
      <div class="rside"><span class="when">${fmtDay(last.t)}</span>${sm?'':`<button class="more-btn" title="Add to folder, export" aria-label="More actions for ${esc(c.name)}" onclick="openMenu(event,'${c.id}')">⋯</button>`}</div>
    </div>${open?renderThread(c):''}`;
  }).join('');
}
function itemHtml(i,c,pm,withName){
  const pk=state.picked.has(i.id);
  const rest=state.folder&&!i.folders.includes(state.folder);
  const hline=`<div class="hash"><svg class="ic"><use href="#i-lock"/></svg><b>hashed at ingestion</b> ${fmtDay(i.t)} ${fmtTime(i.t)} · ${hashOf(i)}</div>`;
  const fchips=i.folders.length?`<div class="ifolders">${i.folders.map(folderById).filter(Boolean).map(f=>`<span>${f.icon} ${esc(cut25(f.name))}<button class="fx" title="Take this item out of ${esc(f.name)}" onclick="event.stopPropagation();unfileItem('${c.id}','${i.id}',${f.id})">×</button></span>`).join('')}</div>`:'';

function fitStrip(){
  const st=document.getElementById('strip'); const more=st.querySelector('.sc.more'); const add=st.querySelector('.sc.add');
  const folders=[...st.querySelectorAll('.sc[data-fid]')]; const first=folders[0]||add; const rel=el=>el.offsetTop-st.offsetTop;
  const rowH=first.offsetHeight+5; const top0=rel(first); const limit=top0+rowH*2-3;
  const fits=el=>el.hidden||rel(el)<limit;
  /* two rows. Keep folders in order (most recent first), skip any that would push past row two, and always keep "All folders" reachable. */
  more.hidden=false; more.querySelector('.t').textContent='All folders ▸'; add.hidden=true; folders.forEach(c=>c.hidden=true);
  folders.forEach(c=>{ c.hidden=false; if(!fits(c)||!fits(more)) c.hidden=c.classList.contains('on')?false:true; });
  add.hidden=false; if(!fits(add)||!fits(more)) add.hidden=true;

/* ---------- filter: one kind of record at a time ---------- */
function openFilter(ev){ ev.stopPropagation(); state.pop={kind:'filter'}; const pop=document.getElementById('pop');
  const all=state.contacts.filter(c=>!state.folder||itemsFor(c).length).filter(c=>state.folder||!state.hidden.has(c.id)); const items=all.flatMap(c=>itemsFor(c)); const k=counts(items);
  const opts=[['all','Everything',items.length+' items'],['text','Texts',k.text],['call','Calls',k.call],['vm','Voicemails',k.vm],['email','Emails',k.email]];
  pop.innerHTML=`<div class="pt">Show only</div>`+opts.map(([key,l,n])=>`<button class="po ${state.filter===key?'in':''}" onclick="state.filter='${key}';closePop();render()"><span class="fn">${l}<small>${n}</small></span><span class="ck"><svg class="ic" style="width:11px;height:11px"><use href="#i-check"/></svg></span></button>`).join('');
  pop.classList.add('open'); placePop(ev,pop); }
/* ---------- name a group or a number ---------- */
function openRename(cid){ const c=contactById(cid); state.pop={kind:'rename'}; const pop=document.getElementById('pop');
  pop.innerHTML=`<div class="pt">${c.group?'Name this group':'Name this number'}</div><div class="newrow" style="border-top:0;margin-top:0"><input id="popnew" type="text" value="${esc(c.group?c.name:'')}" placeholder="${c.group?'e.g. CommLocker Corp':'Who is '+esc(numOf(c))+'?'}" onkeydown="if(event.key==='Enter')saveRename('${cid}')"><button class="btn primary" onclick="saveRename('${cid}')">Save</button></div>`;
  pop.classList.add('open'); const app=document.getElementById('app').getBoundingClientRect(); const w=Math.min(300,app.width-24); pop.style.width=w+'px'; pop.style.left=Math.round((app.width-w)/2)+'px'; pop.style.top=Math.round(app.height*0.3)+'px'; setTimeout(()=>{ const i=document.getElementById('popnew'); if(i){ i.focus({preventScroll:true}); i.select(); } },50); }
function saveRename(cid){ const el=document.getElementById('popnew'); const v=el.value.trim(); if(!v){ el.focus({preventScroll:true}); return; } const c=contactById(cid); c.name=v; if(!c.group){ c.unknown=false; c.role=c.priv?'named by you · caller ID withheld':'named by you · carrier number kept'; } c._labeled=true; saveState(); closePop(); toast(c.group?'Group named '+v:'Named '+v); render(); }
/* ---------- hide people who will never need a folder ---------- */
function hideConv(cid){ state.hidden.add(cid); saveState(); toast(contactById(cid).name+' hidden · find them under “hidden”'); render(); }
function unhideConv(cid){ state.hidden.delete(cid); if(!state.hidden.size&&state.filter==='hidden') state.filter='all'; saveState(); render(); }
/* ---------- close a folder when the deal is done; reopen any time ---------- */
function closeFolder(id){ const f=folderById(id); if(!f) return; f.status='closed'; f.closedAt=Date.now(); fsEdit=null; saveState(); closePop(); if(document.getElementById('fov').classList.contains('open')) renderFolderSheet(); toast('Closed '+f.name+' · it leaves the bottom row, nothing is deleted'); render(); }
function reopenFolder(id){ const f=folderById(id); if(!f) return; f.status='active'; delete f.closedAt; fsEdit=null; saveState(); if(document.getElementById('fov').classList.contains('open')) renderFolderSheet(); toast('Reopened '+f.name); render(); }
function askClose(fid){ const f=folderById(fid); if(!f||f.status==='closed') return; state.pop={kind:'close'}; const pop=document.getElementById('pop');
  pop.innerHTML=`<div class="pt">Exported · close this folder?</div><div class="ps"><b>${esc(f.name)}</b> is done when the deal is done. Closing takes it off the bottom row and stops new items going in. Nothing is deleted, the export stays in Settings › Exports, and you can reopen it any time from manage.</div><div class="pbtns"><button class="btn ghost" onclick="closePop()">Keep open</button><button class="btn primary" onclick="closeFolder(${fid})">Close folder</button></div>`;
  pop.classList.add('open'); const app=document.getElementById('app').getBoundingClientRect(); const w=Math.min(300,app.width-24); pop.style.width=w+'px'; pop.style.left=Math.round((app.width-w)/2)+'px'; pop.style.top=Math.round(app.height*0.3)+'px'; }
/* ---------- select several people, export each separately ---------- */
function startSelect(cid){ state.selMode=true; state.selected.clear(); state.selected.add(cid); state.open.clear(); state.pickMode.clear(); render(); toast('Select the other people, then Export separately.'); }
function toggleSel(cid){ if(state.selected.has(cid)) state.selected.delete(cid); else state.selected.add(cid); render(); }
function endSelect(){ state.selMode=false; state.selected.clear(); render(); }
function openFolder(fid){ state.folder=(fid===null||state.folder===fid)?null:fid; state.view='timeline'; render(); const r=document.getElementById('rows'); if(r) r.scrollTop=0; }
function startFiling(cid){ const c=contactById(cid); state.open.add(cid); state.pickMode.add(cid); itemsFor(c).forEach(i=>state.picked.add(i.id)); render(); const rows=document.getElementById('rows'); const r=rows.querySelector('.row.open'); if(r) rows.scrollTop=r.offsetTop-8; toast('Everything is selected. Deselect what should stay out, then Add selected to folder.'); }
function togglePickMode(cid){ if(state.pickMode.has(cid)){ state.pickMode.delete(cid); contactById(cid).items.forEach(i=>state.picked.delete(i.id)); } else state.pickMode.add(cid); render(); }
function togglePick(iid){ if(state.picked.has(iid)) state.picked.delete(iid); else state.picked.add(iid); render(); }
function pickAll(cid,on){ itemsFor(contactById(cid)).forEach(i=>on?state.picked.add(i.id):state.picked.delete(i.id)); render(); }
function toggleOpen(id){ if(state.open.has(id)) state.open.delete(id); else state.open.add(id); render(); }
function toggleRest(id){ if(state.showRest.has(id)) state.showRest.delete(id); else state.showRest.add(id); render(); }
/* ---------- keep the document pinned; only inner lists scroll ---------- */
function pinDoc(){ if(window.scrollX||window.scrollY) window.scrollTo(0,0); const d=document.documentElement; if(d.scrollLeft||d.scrollTop){ d.scrollLeft=0; d.scrollTop=0; } if(document.body.scrollLeft||document.body.scrollTop){ document.body.scrollLeft=0; document.body.scrollTop=0; } }
window.addEventListener('scroll',pinDoc,{passive:true}); window.addEventListener('resize',pinDoc); window.addEventListener('load',pinDoc); setInterval(pinDoc,800);

/* ---------- theme: system / light / dark ---------- */
const THEMES=[['system','i-auto','System'],['light','i-sun','Light'],['dark','i-moon','Dark']];
let themeIdx=0;
function applyTheme(i,quiet){ themeIdx=i; const [t,icon,label]=THEMES[i]; const r=document.documentElement; if(t==='system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',t); const b=document.getElementById('thm'); b.innerHTML=`<svg class="ic"><use href="#${icon}"/></svg>`; b.title='Theme: '+label+' (tap to change)'; try{ localStorage.setItem('cl-theme',t); }catch(e){} if(!quiet) toast('Theme: '+label); }
function cycleTheme(){ applyTheme((themeIdx+1)%THEMES.length); }
(()=>{ let saved=null; try{ saved=localStorage.getItem('cl-theme'); }catch(e){} const i=Math.max(0,THEMES.findIndex(x=>x[0]===saved)); applyTheme(i,true); })();

/* ---------- guided tour ---------- */
const fakeEv = el => ({ stopPropagation(){}, currentTarget: el });
function scrollRow(cid){ const rows=document.getElementById('rows'); const r=rows.querySelector(`.row[data-cid="${cid}"]`); if(r) rows.scrollTop=r.offsetTop-8; }
function tourReset(){ closePop(); if(ex) closeExport(); state.folder=null; state.pickMode.clear(); state.picked.clear(); state.open.clear(); state.filter='all'; state.q=''; state.range={from:null,to:null}; state.selMode=false; state.selected.clear(); state.view='timeline'; const q=document.getElementById('q'); if(q) q.value=''; render(); document.getElementById('rows').scrollTop=0; }
const TOUR=[
 {t:'Your phone, in one list',d:'Every text, call, voicemail and email, newest first, one line per person. Each item was hashed the moment it came off the phone, before you touch anything. Nothing to set up.',go:()=>{ tourReset(); }},
 {t:'Tap ⋯ on a conversation',d:'Here, Paul Henderson. Two choices: Add to folder, or Export. That is the only menu in the app.',go:()=>{ tourReset(); const btn=document.querySelector('.row[data-cid="c12"] .more-btn'); if(btn){ scrollRow('c12'); openMenu(fakeEv(btn),'c12'); } }},
 {t:'Add to folder: everything starts selected',d:'Deselect what should stay out. We deselect two personal texts. Calls and voicemails sit in the same list, so they are selected the same way.',go:()=>{ tourReset(); startFiling('c12'); const c=contactById('c12'); c.items.filter(i=>i.type==='text').slice(0,2).forEach(i=>state.picked.delete(i.id)); render(); scrollRow('c12'); }},
 {t:'Add selected, then choose the folders',d:'One folder or several. No folder yet? Type a name in the box and it is created and the selection added in one go. We choose Alvarez Drive Listing.',go:()=>{ closePop(); if(!state.pickMode.has('c12')) startFiling('c12'); render(); scrollRow('c12'); const b=document.querySelector('.pickbar .btn.primary'); if(b){ openPop(fakeEv(b),{kind:'items',cid:'c12'}); if(!inFolder(state.pop,1)) fileTo(state.pop,1); openPopRefresh(); } }},
 {pos:'bottom',t:'Tap the folder at the bottom',d:'Active folders sit along the bottom, most recent first. Inside: everyone in the deal by date, calls and voicemails inline, the hash under every record. The ⋯ closes the folder when the deal is done.',go:()=>{ closePop(); state.pickMode.clear(); state.picked.clear(); state.folder=null; openFolder(1); }},
 {t:'Export…',d:'The checks run, every record shows ingestion hash = current hash (MATCH), and the export gets its own hash. Export gives you the PDF and a ZIP of photos, videos, voicemails and email attachments, then asks where: this phone, Drive, Dropbox, email, or any app.',go:()=>{ closePop(); openExport({kind:'folder',id:1}); }},
 {pos:'bottom',t:'Permissions fix themselves',d:'Your RCS case. When a permission slips, the first line of the list says what is not being captured. Fix opens the exact Android screen and the app re-checks when you come back. Tap Fix now, or leave it and try later from Settings › Permissions.',go:()=>{ closePop(); if(ex) closeExport(); openFolder(null); const x=state.perms.find(p=>p.k==='rcs'); x.ok=false; saveState(); render(); document.getElementById('rows').scrollTop=0; }},
 {t:'That is the whole app',d:'One list. Folders along the bottom, with “manage” to rename or delete one. ⋯ to add to a folder or export. Your folders and what is in them are saved on this phone; “Reset sample data” under manage puts the demo back.',go:()=>{ closeExport(); openFolder(null); }},
];
let tourIdx=-1;
function tourStart(){ tourGo(0); }
function tourGo(i){ tourIdx=Math.max(0,Math.min(TOUR.length-1,i)); const st=TOUR[tourIdx]; st.go(); const t=document.getElementById('tour'); t.hidden=false; t.classList.toggle('bottom',st.pos==='bottom'); requestAnimationFrame(()=>{ const pop=document.getElementById('pop'); if(pop.classList.contains('open')&&st.pos!=='bottom'){ const appTop=document.getElementById('app').getBoundingClientRect().top; const tb=t.getBoundingClientRect().bottom+8; if(pop.getBoundingClientRect().top<tb) pop.style.top=(tb-appTop)+'px'; } }); document.getElementById('tour-n').textContent='Step '+(tourIdx+1)+' of '+TOUR.length; document.getElementById('tour-t').textContent=st.t; document.getElementById('tour-d').textContent=st.d; document.getElementById('tour-back').disabled=tourIdx===0; document.getElementById('tour-back').style.opacity=tourIdx===0?'.4':'1'; document.getElementById('tour-next').textContent=tourIdx===TOUR.length-1?'Finish':'Next'; }
function tourStep(d){ if(tourIdx===TOUR.length-1&&d>0){ tourExit(); return; } tourGo(tourIdx+d); }
function tourExit(){ document.getElementById('tour').hidden=true; tourIdx=-1; closePop(); }
render();
</script>
