<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecallText Filing Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#EEF1F6;--card:#FFFFFF;--line:#E1E6EF;--ink:#111827;--ink2:#3B4657;--mute:#6B7480;
  --hd:#1A2F5A;--hd-ink:#FFFFFF;--hd-dim:rgba(255,255,255,.62);--hd-field:rgba(255,255,255,.12);
  --orange:#F97316;--orange-ink:#FFFFFF;--orange-soft:#FFF1E6;--orange-line:#F7C79E;
  --txt-c:#2563EB;--call-c:#0F766E;--vm-c:#16A34A;--miss-c:#DC4B26;
  --amber:#B45309;--amber-soft:#FFF7E0;--amber-line:#F5D98A;
  --in-b:#EEF1F7;--out-b:#FFF1E0;--hover:#F5F7FB;--drop:#FFF1E6;--sel:#FFF7EF;
  --shadow:0 6px 24px rgba(16,28,56,.14);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C182E;--card:#14233F;--line:#25375A;--ink:#EEF2F8;--ink2:#C3CCDB;--mute:#8E9BB0;
    --hd:#0A1428;--hd-ink:#FFFFFF;--hd-dim:rgba(255,255,255,.6);--hd-field:rgba(255,255,255,.1);
    --orange-soft:#3A2410;--orange-line:#7A4A1F;
    --txt-c:#7FA6FF;--call-c:#3FC1B2;--vm-c:#4ADE80;--miss-c:#F0785A;
    --amber:#F5B14B;--amber-soft:#2E2510;--amber-line:#5C4A1A;
    --in-b:#1B2C4C;--out-b:#3A2A18;--hover:#182A49;--drop:#3A2410;--sel:#2A2016;
    --shadow:0 6px 24px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0C182E;--card:#14233F;--line:#25375A;--ink:#EEF2F8;--ink2:#C3CCDB;--mute:#8E9BB0;
  --hd:#0A1428;--hd-ink:#FFFFFF;--hd-dim:rgba(255,255,255,.6);--hd-field:rgba(255,255,255,.1);
  --orange-soft:#3A2410;--orange-line:#7A4A1F;
  --txt-c:#7FA6FF;--call-c:#3FC1B2;--vm-c:#4ADE80;--miss-c:#F0785A;
  --amber:#F5B14B;--amber-soft:#2E2510;--amber-line:#5C4A1A;
  --in-b:#1B2C4C;--out-b:#3A2A18;--hover:#182A49;--drop:#3A2410;--sel:#2A2016;
  --shadow:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.ic{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-2px}

/* ---------- top bar ---------- */
.top{height:54px;background:var(--hd);color:var(--hd-ink);display:flex;align-items:center;gap:18px;padding:0 18px}
.brand{font-weight:800;font-size:19px;color:var(--orange);letter-spacing:-.3px;white-space:nowrap}
.brand small{display:block;font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--hd-dim);margin-top:-3px}
.tag{font-size:12px;color:var(--hd-dim);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--hd-field);border-radius:8px;padding:3px;gap:2px;flex:none}
.seg button{padding:5px 11px;border-radius:6px;font-size:12px;font-weight:700;color:var(--hd-dim)}
.seg button[aria-pressed="true"]{background:var(--orange);color:var(--orange-ink)}

/* ---------- shell ---------- */
#app{max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:481px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 60px rgba(0,0,0,.18)}}
.top{flex:none}
.top .grow{flex:1}
.tourbtn{background:var(--orange);color:#fff;border-radius:999px;padding:7px 14px;font-weight:800;font-size:12px;white-space:nowrap}
.shell{flex:1;min-height:0;display:flex;flex-direction:column;min-width:0}
.pane{background:var(--card);display:flex;flex-direction:column;min-height:0;min-width:0}
.left{flex:1 1 auto}
.tour{position:absolute;top:62px;left:12px;right:12px;z-index:90;transition:top .2s,bottom .2s;}
.tour.bottom{top:auto;bottom:12px}
.tour{background:var(--hd);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tour-h{display:flex;align-items:center;gap:8px;font-size:14px}
.tour-n{background:var(--orange);color:#fff;font-weight:800;font-size:11px;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tour-d{font-size:13px;line-height:1.45;color:rgba(255,255,255,.85);margin-top:6px}
.tour-a{display:flex;gap:6px;align-items:center;margin-top:10px}
.tour-a .grow{flex:1}
.tour .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.tour .btn.primary{background:var(--orange)}
.tour .btn:hover{color:#fff}
.ph{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ph-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ph h2{font-size:16px;font-weight:800;letter-spacing:-.2px}
.ph .count{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mute)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
.search input::placeholder{color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:5px;background:var(--card)}
.chip[aria-pressed="true"]{background:var(--hd);color:#fff;border-color:var(--hd)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.7;font-weight:600}
.scroll{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain;position:relative}

/* folder banner in left pane */
.btn.back{align-self:flex-start;border-color:var(--orange);color:var(--orange);background:var(--orange-soft);font-size:13px;padding:8px 14px;margin-bottom:2px}
.fbanner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--sel);border:1px solid var(--orange-line)}
.fbanner .fi{font-size:20px;flex:none}
.fbanner b{font-size:14px}
.fbanner .m{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.fbanner .grow{flex:1;min-width:0}
.btn{padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--orange);color:var(--orange)}
.btn.primary{background:var(--orange);color:var(--orange-ink);border-color:var(--orange)}
.btn.primary:hover{filter:brightness(.95);color:var(--orange-ink)}
.btn.ghost{border-color:transparent}

.seg.dark{background:color-mix(in srgb,var(--line) 60%,transparent);align-self:flex-start}
.seg.dark button{color:var(--ink2)}
.tl{padding:6px 16px 14px}
.tl .who2{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--mute);margin:8px 0 2px}
.tl .who2 .av{width:20px;height:20px;font-size:9px}
.tl .out .who2{flex-direction:row-reverse}
.tlsum{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px 4px;font-size:12px;color:var(--mute)}
.tlsum .fchip{max-width:none}
/* ---------- conversation rows ---------- */
.row{display:grid;grid-template-columns:22px 40px 1fr auto;gap:12px;align-items:start;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.row:hover{background:var(--hover)}
.row.open{background:var(--hover)}
.row.dim{opacity:.55}
.row.dragging{opacity:.4}
.row .sel{margin-top:12px;width:16px;height:16px;accent-color:var(--orange);cursor:pointer}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:-.02em}
.l1{display:flex;align-items:baseline;gap:8px;min-width:0}
.l1 b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1 .role{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.l2{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px;margin-top:2px;min-width:0}
.l2 .prev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.l3{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.kind{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.kind .ic{width:12px;height:12px}
.k-text{color:var(--txt-c);background:color-mix(in srgb,var(--txt-c) 12%,transparent)}
.k-call{color:var(--call-c);background:color-mix(in srgb,var(--call-c) 12%,transparent)}
.k-vm{color:var(--vm-c);background:color-mix(in srgb,var(--vm-c) 12%,transparent)}
.k-miss{color:var(--miss-c);background:color-mix(in srgb,var(--miss-c) 12%,transparent)}
.cnt{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;display:inline-flex;gap:8px}
.fchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px 2px 5px;border-radius:999px;border:1px solid var(--orange-line);background:var(--orange-soft);color:var(--amber);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.fchip.none{border-style:dashed;color:var(--mute);background:transparent;border-color:var(--line)}
.rside{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.when{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.file{padding:5px 10px;border-radius:8px;border:1.5px dashed var(--orange);color:var(--orange);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;background:var(--card)}
.file:hover{background:var(--orange-soft)}

/* thread */
.thread{background:var(--bg);border-bottom:1px solid var(--line);padding:6px 16px 14px 16px}
.divider{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);padding:12px 6px 6px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.item{display:flex;gap:8px;padding:4px 0;align-items:flex-end}
.item.out{flex-direction:row-reverse}
.item[draggable]{cursor:grab}
.item.dragging{opacity:.4}
.bubble{max-width:min(72%,560px);background:var(--in-b);border-radius:14px;padding:8px 12px 6px;position:relative}
.out .bubble{background:var(--out-b)}
.bubble .who{font-size:11px;font-weight:700;color:var(--mute);margin-bottom:1px}
.bubble .t{white-space:pre-wrap;word-wrap:break-word}
.bubble .ts{font-size:10px;color:var(--mute);text-align:right;margin-top:3px;font-variant-numeric:tabular-nums}
.note{margin-top:6px;padding:6px 9px;background:var(--amber-soft);border-left:3px solid var(--amber);border-radius:0 6px 6px 0;font-size:12px;color:var(--amber)}
.note b{font-size:10px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:1px}
.att{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:6px;background:var(--card);border:1px solid var(--line);margin:6px 4px 0 0;color:var(--ink2)}
.card{max-width:min(72%,560px);background:var(--card);border:1px solid var(--line);border-left:3px solid var(--call-c);border-radius:10px;padding:9px 12px}
.card.vm{border-left-color:var(--vm-c)}
.card.miss{border-left-color:var(--miss-c)}
.card .h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--call-c)}
.card.vm .h{color:var(--vm-c)}
.card.miss .h{color:var(--miss-c)}
.card .h .ts{margin-left:auto;font-weight:500;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.card .q{font-style:italic;color:var(--ink2);margin-top:4px;font-size:13px}
.card .n{margin-top:5px;font-size:12px;color:var(--ink2)}
.ifile{opacity:.35;transition:opacity .12s;align-self:center;padding:4px;border-radius:6px;color:var(--mute)}
.item:hover .ifile{opacity:1}
.ifile:hover{color:var(--orange);background:var(--orange-soft)}
.hash{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:10px;color:var(--mute);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hash .ic{width:10px;height:10px;color:var(--vm-c)}
.hash b{color:var(--vm-c);font-weight:700}
.k-lock{color:var(--mute);background:color-mix(in srgb,var(--mute) 12%,transparent)}
.ifolders{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.ifolders span{font-size:10px;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.more{margin:8px 6px 0;font-size:12px;color:var(--mute)}
.thead{display:flex;align-items:center;gap:8px;padding:10px 4px 4px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.thead .grow{flex:1}
.thead .btn{padding:5px 10px;font-size:12px}
.thead .btn.on{background:var(--hd);color:#fff;border-color:var(--hd)}
.pk{width:18px;height:18px;accent-color:var(--orange);align-self:center;flex:none;cursor:pointer}
.item.pickable{cursor:pointer;border-radius:12px;padding:6px 4px}
.item.pickable:hover{background:color-mix(in srgb,var(--orange) 8%,transparent)}
.item.picked{background:var(--sel);outline:1.5px solid var(--orange-line)}
.pickbar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:10px -16px -14px;padding:10px 16px;background:var(--card);border-top:1px solid var(--orange-line);font-size:13px;font-weight:600;box-shadow:0 -6px 16px rgba(16,28,56,.06)}
.pickbar .grow{flex:1}
.narrow .pickbar{margin:10px -10px -12px;padding:10px}
.more button{color:var(--orange);font-weight:700}
.item.rest{opacity:.42}

/* multi-select bar */
.selbar{display:none;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);background:var(--sel);font-size:13px;font-weight:600}
.selbar.on{display:flex}
.selbar .grow{flex:1}

/* ---------- folders pane ---------- */
.newf{display:flex;gap:8px;align-items:center;border:1.5px dashed var(--orange-line);border-radius:10px;padding:8px 10px;background:var(--card)}
.newf.hot{background:var(--drop);border-color:var(--orange);border-style:solid}
.newf input{flex:1;background:none;border:0;outline:0;min-width:0}
.newf input::placeholder{color:var(--mute)}
.fl{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.folder{display:grid;grid-template-columns:38px 1fr;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card);transition:border-color .12s,background .12s}
.folder:hover{border-color:var(--orange-line)}
.folder.on{border-color:var(--orange);background:var(--sel)}
.folder.hot{border-color:var(--orange);background:var(--drop);border-style:dashed}
.folder .fi{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.folder .fn{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder .fm{font-size:11px;color:var(--mute);margin-top:2px;font-variant-numeric:tabular-nums}
.folder .fs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.folder .fs .kind{font-size:10px;padding:1px 6px}
.folder .fa{display:flex;gap:6px;margin-top:8px}
.folder .fa .btn{padding:5px 9px;font-size:11px}
.hint{padding:10px 16px 14px;font-size:12px;color:var(--mute);line-height:1.5;border-top:1px solid var(--line)}

/* strip (phone) */
.strip{display:none}

/* ---------- popover / toast ---------- */
.pop{position:fixed;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:280px;max-width:calc(100vw - 24px);padding:6px;display:none}
.pop.open{display:block}
.pop .pt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:8px 10px 4px}
.pop .po{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
.pop .po:hover{background:var(--hover)}
.pop .po .fi{font-size:18px;width:24px;text-align:center}
.pop .po .fn{flex:1;font-weight:600;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop .po .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff}
.pop .po.in .ck{background:var(--vm-c);border-color:var(--vm-c)}
.pop .ps{font-size:11px;color:var(--mute);padding:0 10px 6px}
.pop .done{display:flex;justify-content:flex-end;padding:6px 8px 2px}
.pop .newrow{display:flex;gap:6px;padding:6px 8px 4px;border-top:1px solid var(--line);margin-top:4px}
.pop .newrow input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:0;min-width:0}
.pop .newrow input:focus{border-color:var(--orange)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);background:var(--hd);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:60;box-shadow:var(--shadow);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{padding:40px 20px;text-align:center;color:var(--mute);font-size:13px}


/* ---------- three-dot menu + export sheet ---------- */
.more-btn{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-weight:800;font-size:18px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.more-btn:hover{border-color:var(--orange);color:var(--orange)}
.pop .po small{display:block;font-size:11px;color:var(--mute);font-weight:500;margin-top:1px}
.ov{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
.ov.open{display:flex}
.sheet{background:var(--card);color:var(--ink);border-radius:16px;width:100%;max-width:620px;max-height:calc(100vh - 32px);overflow-y:auto;box-shadow:var(--shadow);padding:18px 20px 20px}
.sheet h3{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.sheet .sub{font-size:12px;color:var(--mute);margin-top:2px}
.sheet h4{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
.chk{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px;font-weight:700;font-size:13px;flex-wrap:wrap}
.chk.ok{border-color:color-mix(in srgb,var(--vm-c) 40%,transparent);background:color-mix(in srgb,var(--vm-c) 8%,transparent);color:var(--vm-c)}
.chk.warn{border-color:var(--orange-line);background:var(--orange-soft);color:var(--amber)}
.chk .d{margin-left:auto;font-weight:500;font-size:12px;color:var(--mute)}
.chk .fix{width:100%;display:flex;gap:6px;margin-top:6px}
.chk .fix input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;outline:0;min-width:0;font-weight:500;color:var(--ink)}
.scope{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.scope .bx{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.scope .bx small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.scope .bx b{font-size:15px;display:block}
.scope .bx span{font-size:12px;color:var(--mute)}
.scope .arr{color:var(--orange);font-weight:800;font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.tiles div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px}
.tiles div small{font-size:10px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.hashbox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.55;margin-bottom:6px}
.hashbox b{display:block;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.hashbox .ok{color:var(--vm-c);font-weight:700}
.hashbox .why{display:block;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:12px;color:var(--ink2);margin-top:4px;word-break:normal}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
.opt.on{border-color:var(--orange);background:var(--sel)}
.opt input{margin-top:3px;accent-color:var(--orange);flex:none}
.opt b{display:block;font-size:13px}
.opt span{font-size:12px;color:var(--mute)}
.files{font-size:12px;color:var(--ink2);margin-top:6px;display:flex;flex-direction:column;gap:2px}
.files code{font-family:ui-monospace,Menlo,monospace;font-size:11px}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.sheet .actions .grow{flex:1}
.preview{margin-top:14px;border:1px solid #cfd5df;border-radius:10px;padding:16px;background:#fff;color:#111;font-size:11.5px;line-height:1.5;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.preview h5{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px;color:#1A2F5A}
.preview .brand{font-size:16px;font-weight:800;color:#1A2F5A}.preview .brand em{color:#F97316;font-style:normal}
.preview .row2{display:grid;grid-template-columns:auto 1fr;gap:1px 12px}
.preview .row2 span:nth-child(odd){color:#555}
.preview .mono{font-family:ui-monospace,Menlo,monospace;font-size:10px;word-break:break-all;color:#333}
.preview .m{color:#16A34A;font-weight:700}
.preview hr{border:0;border-top:1px solid #ddd;margin:10px 0}
.preview p{margin:0 0 4px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}.scope{grid-template-columns:1fr;} .scope .arr{transform:rotate(90deg);justify-self:center}}

/* ---------- narrow / phone layout ---------- */
.narrow .strip{display:flex;flex:none;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--card);border-top:1px solid var(--line)}
.narrow .strip .lbl{width:100%;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:0 2px 2px}
.sc{flex:none;display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;border:1.5px solid var(--line);font-size:11px;font-weight:700;background:var(--card);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.sc.on{border-color:var(--orange);background:var(--sel)}
.sc.hot{border-color:var(--orange);background:var(--drop)}
.sc.add{border-style:dashed;color:var(--orange);border-color:var(--orange-line)}
.sc .n{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:600}
.narrow .row{grid-template-columns:36px 1fr auto;gap:10px;padding:11px 12px}
.narrow .l1 .role{display:none}
.narrow .bubble,.narrow .card{max-width:84%}
.narrow .ifile{opacity:1}
.narrow .thread{padding:4px 10px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

er is Maryann P at American Trust Escrow. Her number is (310) 555-2222. Please call her and get the wiring instructions.","ts":"Mar 18, 2026 · 4:03 PM","t":1773849780000,"note":null,"att":[],"folders":[5]},{"id":"c12_t2","type":"text","dir":"in","sender":"Paul Henderson","text":"Yay!! Thanks Lauren, super excited about the place! Ok, I will call her tomorrow and get the information I need.","ts":"Mar 18, 2026 · 4:47 PM","t":1773852420000,"note":null,"att":[],"folders":[5]},{"id":"c12_t3","type":"text","dir":"out","sender":"Lauren Cotner","text":"Watch your email — I will send over the fully executed contract. There will be a few items you need to sign. We can chat after you get off work and I can walk you through everything.","ts":"Mar 18, 2026 · 4:51 PM","t":1773852660000,"note":null,"att":[],"folders":[5]},{"id":"c12_t4","type":"text","dir":"in","sender":"Paul Henderson","text":"Great, I'll look at it tonight. Thanks Lauren!","ts":"Mar 18, 2026 · 5:12 PM","t":1773853920000,"note":null,"att":[],"folders":[5]},{"id":"call6","type":"call","dir":"out","missed":false,"ts":"Mar 18, 2026 · 5:45 PM","t":1773855900000,"dur":"17:38","note":"Walked Paul through all remaining contract documents — where he needed to sign. He did not seem concerned about any items. NOTE: Sellers agent sent over City Building Report needing signature, NHD, Inspection Report with Reports Received form. Paul reviewed all. He will be calling escrow tomorrow re: wiring instructions.","folders":[5]},{"id":"call10","type":"call","dir":"out","missed":true,"ts":"Mar 21, 2026 · 6:35 PM","t":1774118100000,"dur":"0:00","note":"NO ANSWER. Left voicemail for Paul — EMD has not been received by escrow. Contract may be cancelled if seller sends demand letter. Urged him to call me back tonight.","folders":[5]},{"id":"c12_t5","type":"text","dir":"in","sender":"Paul Henderson","text":"Hi Lauren, I'm so sorry — my mother had a stroke. I've been at the hospital. I would like to move forward, I just need a few more days on the contract. Can you ask for an extension? I worry I may not be as available for the required inspections due to mom.","ts":"Mar 24, 2026 · 4:45 PM","t":1774370700000,"note":null,"att":[],"folders":[5]},{"id":"c12_t6","type":"text","dir":"out","sender":"Lauren Cotner","text":"Oh no Paul, I am so sorry. Family first — always. Yes, I will check with the seller's agent and let them know what happened. I will see if we can move the start of contract out a week, based on you putting the EMD in tomorrow.","ts":"Mar 24, 2026 · 5:02 PM","t":1774371720000,"note":null,"att":[],"folders":[5]},{"id":"c12_t7","type":"text","dir":"in","sender":"Paul Henderson","text":"Perfect, thank you Lauren.","ts":"Mar 24, 2026 · 5:09 PM","t":1774372140000,"note":null,"att":[],"folders":[5]},{"id":"c12_t8","type":"text","dir":"in","sender":"Paul Henderson","text":"Got it.","ts":"Mar 25, 2026 · 11:04 AM","t":1774436640000,"note":"Agent Note: Paul signed MOT. Received copy signed by Seller from Edward Barrios.","att":[],"folders":[5]},{"id":"c12_t9","type":"text","dir":"out","sender":"Lauren Cotner","text":"Paul — we got the signed MOT back from the seller. Check your email.","ts":"Mar 25, 2026 · 6:30 PM","t":1774463400000,"note":null,"att":[],"folders":[5]},{"id":"c12_t10","type":"text","dir":"out","sender":"Lauren Cotner","text":"Paul — we received the demand letter. You need to put your earnest money into escrow or the seller may cancel.","ts":"Mar 27, 2026 · 9:05 AM","t":1774602300000,"note":null,"att":[],"folders":[5]},{"id":"c12_t11","type":"text","dir":"in","sender":"Paul Henderson","text":"Lauren, the start of contract date was moved out a week — so technically I have 3 more additional days after that week.","ts":"Mar 27, 2026 · 9:22 AM","t":1774603320000,"note":null,"att":[],"folders":[5]},{"id":"c12_t12","type":"text","dir":"out","sender":"Lauren Cotner","text":"Paul, I understand your thought process — but did you review what you signed? It also stated that seller agrees to e function fullHash(seed){ let out=''; let h=0x811c9dc5; for(let r=0;r<8;r++){ for(let k=0;k<seed.length;k++){ h^=seed.charCodeAt(k); h=Math.imul(h,16777619)>>>0; } h^=Math.imul(r+1,0x9e3779b9)>>>0; h=Math.imul(h^(h>>>15),2246822519)>>>0; h=(h^(h>>>13))>>>0; out+=h.toString(16).padStart(8,'0'); } return out; }
const itemSeed = i => (i.text||i.transcript||i.note||'')+'|'+i.ts+'|'+i.type;
function hashOf(i){ return 'sha256:'+fullHash(itemSeed(i)).slice(0,16)+'…'; }

function attachmentsOf(list){ const files=[]; list.forEach(({i,c})=>{ (i.att||[]).forEach(a=>files.push({name:a.name,kind:a.type,from:c.name,seed:a.name+i.ts})); if(i.type==='vm'){ const d=new Date(i.t); const stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0'); files.push({name:'voicemail-'+stamp+'.m4a',kind:'audio',from:c.name,seed:'a'+i.ts}); files.push({name:'voicemail-'+stamp+'-transcript.txt',kind:'text',from:c.name,seed:'t'+i.ts}); } }); return files; }

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- filing ---------- */
function addTo(item,fid){ if(!item.folders.includes(fid)) item.folders.push(fid); }
function removeFrom(item,fid){ item.folders=item.folders.filter(f=>f!==fid); }
function payloadItems(p){
  if(p.kind==='conv') return contactById(p.id).items;
  if(p.kind==='item') return [contactById(p.cid).items.find(i=>i.id===p.id)];
  if(p.kind==='multi') return [...state.selected].flatMap(id=>contactById(id).items);
  if(p.kind==='items') return contactById(p.cid).items.filter(i=>state.picked.has(i.id));
  return [];
}
function payloadName(p){
  if(p.kind==='conv') return contactById(p.id).name;
  if(p.kind==='item'){ const i=payloadItems(p)[0]; return (i.type==='text'?'message':i.type==='vm'?'voicemail':'call')+' from '+contactById(p.cid).name; }
  if(p.kind==='items'){ const n=payloadItems(p).length; return n+' item'+(n!==1?'s':'')+' from '+contactById(p.cid).name; }
  return state.selected.size+' conversations';
}
function fileTo(p,fid){
  const f=folderById(fid); payloadItems(p).forEach(i=>addTo(i,fid));
  toast('Filed '+payloadName(p)+' → '+f.icon+' '+f.name); render();
}
function unfileFrom(p,fid){
  const f=folderById(fid); payloadItems(p).forEach(i=>removeFrom(i,fid));
  toast('Removed '+payloadName(p)+' from '+f.name); render();
}
function inFolder(p,fid){ const it=payloadItems(p); return it.length>0 && it.every(i=>i.folders.includes(fid)); }
function createFolder(name){
  const id=Math.max(0,...state.folders.map(f=>f.id))+1;
  const f={id,name,cat:'New',icon:'📁',note:''}; state.folders.push(f); return f;
}

function popNew(){ const el=document.getElementById('popnew'); const n=el.value.trim(); if(!n){el.focus();return;} const f=createFolder(n); fileTo(state.pop,f.id); closePop(); }
function closePop(){ const p=state.pop; document.getElementById('pop').classList.remove('open'); state.pop=null; if(p&&p.kind==='multi'){ state.selected.clear(); render(); } }

/* ---------- drag & drop ---------- */
let drag=null;
function dragStart(ev,p){ drag=p; ev.dataTransfer.effectAllowed='link'; ev.dataTransfer.setData('text/plain',payloadName(p)); ev.currentTarget.classList.add('dragging'); }
function dragEnd(ev){ ev.currentTarget.classList.remove('dragging'); drag=null; document.querySelectorAll('.hot').forEach(e=>e.classList.remove('hot')); }
function dropTargets(){
  document.querySelectorAll('[data-drop]').forEach(el=>{
    el.addEventListener('dragover',e=>{ if(!drag) return; e.preventDefault(); e.dataTransfer.dropEffect='link'; el.classList.add('hot'); });
    el.addEventListener('dragleave',()=>el.classList.remove('hot'));
    el.addEventListener('drop',e=>{
      e.preventDefault(); el.classList.remove('hot'); if(!drag) return;
      const fid=el.dataset.drop;
      fileTo(drag,+fid);
      drag=null;
    });
  });
}

/* ---------- render ---------- */
function visibleContacts(){
  const q=state.q.trim().toLowerCase();
  return state.contacts.filter(c=>{
    const items=itemsFor(c); if(state.folder && !items.length) return false;
    if(state.filter==='text'&&!items.some(i=>i.type==='text')) return false;
    if(state.filter==='call'&&!items.some(i=>i.type==='call')) return false;
    if(state.filter==='vm'&&!items.some(i=>i.type==='vm')) return false;
    if(state.filter==='unfiled'&&convFolders(c).length) return false;
    if(q){ const hay=(c.name+' '+c.number+' '+c.role+' '+c.items.map(i=>i.text||i.transcript||i.note||'').join(' ')).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}

  document.getElementById('app').classList.add('narrow');
  renderBanner(); renderChips(); renderRows(); renderStrip(); dropTargets();
}

  let body;
  if(i.type==='text'){
    body=`<div class="bubble"><div class="who">${esc(i.sender)}</div><div class="t">${esc(i.text)}</div>${(i.att||[]).map(a=>`<span class="att" title="${esc(a.name)}">${a.type==='pdf'?'📄':a.type==='video'?'🎬':'🖼'} ${esc(a.caption||a.name)}</span>`).join('')}${i.note?`<div class="note"><b>Agent note</b>${esc(i.note)}</div>`:''}<div class="ts">${fmtTime(i.t)}</div>${hline}${fchips}</div>`;
  } else if(i.type==='vm'){
    body=`<div class="card vm"><div class="h"><svg class="ic"><use href="#i-vm"/></svg>${kindLabel(i)} · ${i.dur}<span class="ts">${fmtTime(i.t)}</span></div><div class="q">“${esc(i.transcript)}”</div>${i.note?`<div class="note"><b>Agent note</b>${esc(i.note)}</div>`:''}${hline}${fchips}</div>`;
  } else {
    body=`<div class="card ${i.missed?'miss':''}"><div class="h"><svg class="ic"><use href="#${kindIcon(i)}"/></svg>${kindLabel(i)}${i.dur&&i.dur!=='0:00'?' · '+i.dur:''}<span class="ts">${fmtTime(i.t)}</span></div>${i.note?`<div class="n">${esc(i.note)}</div>`:''}${hline}${fchips}</div>`;
  }
  const cb=pm?`<input type="checkbox" class="pk" ${pk?'checked':''} onclick="event.stopPropagation();togglePick('${i.id}')" aria-label="Pick this ${i.type}">`:'';
  const wrap=`<div class="item ${i.dir==='out'?'out':''} ${rest?'rest':''} ${pm?'pickable':''} ${pk?'picked':''}" draggable="true" ondragstart="event.stopPropagation();dragStart(event,${pm&&pk?`{kind:'items',cid:'${c.id}'}`:`{kind:'item',cid:'${c.id}',id:'${i.id}'}`})" ondragend="dragEnd(event)" onclick="event.stopPropagation();${pm?`togglePick('${i.id}')`:''}">${cb}${body}${pm?'':fileBtn}</div>`;
  return withName?`<div class="${i.dir==='out'?'out':''}">${nm}${wrap}</div>`:wrap;
}
function renderTimeline(){
  const f=folderById(state.folder);
  const all=[]; state.contacts.forEach(c=>c.items.forEach(i=>{ if(i.folders.includes(f.id)) all.push({i,c}); }));
  all.sort((a,b)=>a.i.t-b.i.t);
  if(!all.length) return '<div class="empty">Nothing filed here yet. Go back to Everything, open a conversation, pick the messages, and file them to this folder.</div>';
  const people=[...new Set(all.map(x=>x.c))];
  let html=`<div class="tlsum"><span>${all.length} items from</span>${people.map(c=>`<span class="fchip" style="border-color:${c.color}55;background:${c.color}14;color:${c.color}">${esc(c.name)}</span>`).join('')}</div><div class="tl">`;
  let lastDay='';
  all.forEach(({i,c})=>{ const day=fmtDivider(i.t); if(day!==lastDay){ html+=`<div class="divider"><span>${day}</span></div>`; lastDay=day; } html+=itemHtml(i,c,false,true); });
  return html+'</div>';
}
function renderThread(c){
  const show=state.showRest.has(c.id);
  const items=(state.folder&&show)?c.items:itemsFor(c);
  const hidden=state.folder?c.items.length-itemsFor(c).length:0;
  const pm=state.pickMode.has(c.id);
  const pickedHere=items.filter(i=>state.picked.has(i.id)).length;
  let html=`<div class="thread"><div class="thead">
    <span>${items.length} items in date order · each one hashed when it was pulled from the phone</span><span class="grow"></span>
    <button class="btn ${pm?'on':''}" onclick="event.stopPropagation();togglePickMode('${c.id}')">${pm?'Cancel picking':'Pick messages'}</button>
    ${pm?`<button class="btn ghost" onclick="event.stopPropagation();pickAll('${c.id}',true)">All</button><button class="btn ghost" onclick="event.stopPropagation();pickAll('${c.id}',false)">None</button>`:''}
  </div>`, lastDay='';
  items.forEach(i=>{
    const day=fmtDivider(i.t); if(day!==lastDay){ html+=`<div class="divider"><span>${day}</span></div>`; lastDay=day; }
    html+=itemHtml(i,c,pm,false);
  });
  if(hidden>0) html+=`<div class="more">${hidden} more in this conversation not filed here · <button onclick="event.stopPropagation();toggleRest('${c.id}')">${show?'hide':'show faded'}</button></div>`;
  if(pm) html+=`<div class="pickbar" onclick="event.stopPropagation()"><span style="white-space:nowrap">${pickedHere} of ${items.length} picked</span><span class="grow"></span>
    <button class="btn primary" ${pickedHere?'':'disabled style="opacity:.5"'} onclick="openPop(event,{kind:'items',cid:'${c.id}'})"><svg class="ic"><use href="#i-folder"/></svg> File picked to folder(s)…</button>
    <button class="btn ghost" onclick="togglePickMode('${c.id}')">Done</button></div>`;
  return html+'</div>';
}
function renderStrip(){
  document.getElementById('strip').innerHTML=
    `<div class="lbl">Folders · tap one to open its timeline · tap again to go back</div><button class="sc ${!state.folder?'on':''}" onclick="openFolder(null)"><svg class="ic" style="width:11px;height:11px"><use href="#i-back"/></svg> All conversations</button>`+
    state.folders.map(f=>`<button class="sc ${state.folder===f.id?'on':''}" data-drop="${f.id}" onclick="openFolder(${f.id})">${f.icon} ${esc(f.name)} <span class="n">${folderStats(f.id).items}</span></button>`).join('')+
    `<button class="sc add" onclick="stripNew(event)"><svg class="ic"><use href="#i-plus"/></svg> New folder</button>`;
}
function stripNew(ev){ ev.stopPropagation(); state.pop={kind:'newfolder'}; const pop=document.getElementById('pop'); pop.innerHTML=`<div class="pt">New folder</div><div class="newrow" style="border-top:0;margin-top:0"><input id="popnew" type="text" placeholder="Name it, e.g. 1234 Main St" onkeydown="if(event.key==='Enter')stripNewCreate()"><button class="btn primary" onclick="stripNewCreate()">Create</button></div>`; pop.classList.add('open'); placePop(ev,pop); setTimeout(()=>{ const i=document.getElementById('popnew'); if(i) i.focus(); },50); }
function stripNewCreate(){ const el=document.getElementById('popnew'); const n=el.value.trim(); if(!n){ el.focus(); return; } const f=createFolder(n); closePop(); toast('Folder created: '+f.name); openFolder(f.id); }
function openFolder(fid){ state.folder=(fid===null||state.folder===fid)?null:fid; state.view='timeline'; render(); const r=document.getElementById('rows'); if(r) r.scrollTop=0; }
function startFiling(cid){ const c=contactById(cid); state.open.add(cid); state.pickMode.add(cid); itemsFor(c).forEach(i=>state.picked.add(i.id)); render(); const rows=document.getElementById('rows'); const r=rows.querySelector('.row.open'); if(r) rows.scrollTop=r.offsetTop-8; toast('Everything is ticked. Untick what should stay out, then File picked.'); }
function togglePickMode(cid){ if(state.pickMode.has(cid)){ state.pickMode.delete(cid); contactById(cid).items.forEach(i=>state.picked.delete(i.id)); } else state.pickMode.add(cid); render(); }
function togglePick(iid){ if(state.picked.has(iid)) state.picked.delete(iid); else state.picked.add(iid); render(); }
function pickAll(cid,on){ itemsFor(contactById(cid)).forEach(i=>on?state.picked.add(i.id):state.picked.delete(i.id)); render(); }
function toggleOpen(id){ if(state.open.has(id)) state.open.delete(id); else state.open.add(id); render(); }
function toggleRest(id){ if(state.showRest.has(id)) state.showRest.delete(id); else state.showRest.add(id); render(); }
/* ---------- guided tour ---------- */
const fakeEv = el => ({ stopPropagation(){}, currentTarget: el });
function scrollRow(cid){ const rows=document.getElementById('rows'); const r=rows.querySelector(`.row[data-cid="${cid}"]`); if(r) rows.scrollTop=r.offsetTop-8; }
function tourReset(){ closePop(); if(ex) closeExport(); state.folder=null; state.pickMode.clear(); state.picked.clear(); state.open.clear(); state.filter='all'; state.q=''; const q=document.getElementById('q'); if(q) q.value=''; render(); document.getElementById('rows').scrollTop=0; }
const TOUR=[
 {t:'Your phone, in one list',d:'Every text, call and voicemail, newest first, one line per person. Each item was hashed the moment it came off the phone, before you touch anything. Nothing to set up.',go:()=>{ tourReset(); }},
 {t:'Tap ⋯ on a conversation',d:'Here, Paul Henderson. Two choices: Add to folder, or Export. That is the only menu in the app.',go:()=>{ tourReset(); const btn=document.querySelector('.row[data-cid="c12"] .more-btn'); if(btn){ scrollRow('c12'); openMenu(fakeEv(btn),'c12'); } }},
 {t:'Add to folder: everything starts ticked',d:'Untick what should stay out. We untick two personal texts. Calls and voicemails sit in the same list, so they are picked the same way.',go:()=>{ tourReset(); startFiling('c12'); const c=contactById('c12'); c.items.filter(i=>i.type==='text').slice(0,2).forEach(i=>state.picked.delete(i.id)); render(); scrollRow('c12'); }},
 {t:'File picked, then tick the folders',d:'One folder or several. No folder yet? Type a name in the box and it is created and filed in one go. We tick Alvarez Drive Listing.',go:()=>{ closePop(); if(!state.pickMode.has('c12')) startFiling('c12'); render(); scrollRow('c12'); const b=document.querySelector('.pickbar .btn.primary'); if(b){ openPop(fakeEv(b),{kind:'items',cid:'c12'}); if(!inFolder(state.pop,1)) fileTo(state.pop,1); openPopRefresh(); } }},
 {pos:'bottom',t:'Tap the folder at the bottom',d:'This is the transaction timeline: everyone in the deal, by date, calls and voicemails inline, the hash under every record. The orange button at the top takes you back.',go:()=>{ closePop(); state.pickMode.clear(); state.picked.clear(); state.folder=null; openFolder(1); }},
 {pos:'bottom',t:'Export…',d:'The checks run, every record shows ingestion hash = current hash (MATCH), and the export gets its own hash. You get the PDF and a ZIP of the photos, videos and voicemails.',go:()=>{ closePop(); openExport({kind:'folder',id:1}); ex.preview=true; renderExport(); }},
 {t:'That is the whole app',d:'One list. Folders along the bottom. ⋯ to file or export. Tap Finish and keep exploring; Paul’s items stay filed in Alvarez until you untick them.',go:()=>{ closeExport(); openFolder(null); }},
];
let tourIdx=-1;
function tourStart(){ tourGo(0); }
function tourGo(i){ tourIdx=Math.max(0,Math.min(TOUR.length-1,i)); const st=TOUR[tourIdx]; st.go(); const t=document.getElementById('tour'); t.hidden=false; t.classList.toggle('bottom',st.pos==='bottom'); requestAnimationFrame(()=>{ const pop=document.getElementById('pop'); if(pop.classList.contains('open')&&st.pos!=='bottom'){ const tb=t.getBoundingClientRect().bottom+8; if(pop.getBoundingClientRect().top<tb) pop.style.top=tb+'px'; } }); document.getElementById('tour-n').textContent='Step '+(tourIdx+1)+' of '+TOUR.length; document.getElementById('tour-t').textContent=st.t; document.getElementById('tour-d').textContent=st.d; document.getElementById('tour-back').disabled=tourIdx===0; document.getElementById('tour-back').style.opacity=tourIdx===0?'.4':'1'; document.getElementById('tour-next').textContent=tourIdx===TOUR.length-1?'Finish':'Next'; }
function tourStep(d){ if(tourIdx===TOUR.length-1&&d>0){ tourExit(); return; } tourGo(tourIdx+d); }
function tourExit(){ document.getElementById('tour').hidden=true; tourIdx=-1; closePop(); }
render();
// first look: land on the expanded conversation so texts, calls and voicemails show together
requestAnimationFrame(()=>{ const r=document.querySelector('.row.open'); if(r) document.getElementById('rows').scrollTop=r.offsetTop-8; });
</script>
